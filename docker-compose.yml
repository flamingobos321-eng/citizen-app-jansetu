name: jansetu   # ← namespaces ALL containers, volumes and networks
                # containers: jansetu-mongodb-1, jansetu-backend-1, jansetu-frontend-1
                # volumes:    jansetu_mongo_data, jansetu_uploads_data …
                # never conflicts with VianBills or any other Compose project

# ── JANSETU — Production Docker Compose ────────────────────────────────────
#
# GitHub is the single source of truth.
# NEVER edit files on the VPS — commit to GitHub, then run scripts/deploy.sh.
#
# First run:
#   cp .env.example .env && nano .env
#   ./scripts/deploy.sh
#
# Subsequent deploys:
#   ./scripts/deploy.sh          ← pulls from GitHub, rebuilds, rolling restart

services:

  # ── MongoDB (JanSetu-exclusive) ───────────────────────────────────────────
  # Host port 27018 avoids conflict with VianBills MongoDB on 27017.
  # The container is only reachable from localhost — not from the internet.
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - internal
    ports:
      - "127.0.0.1:27018:27017"   # host:27018 → container:27017
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── FastAPI backend ────────────────────────────────────────────────────────
  # Not exposed to the host — only reachable inside the internal Docker network
  # (the frontend container proxies /api → backend:8000).
  backend:
    image: jansetu-backend:${DEPLOY_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - internal
    expose:
      - "8000"
    volumes:
      - uploads_data:/var/data/jansetu/uploads
      - ./backend/secrets/firebase-admin.json:/app/secrets/firebase-admin.json:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "7"

  # ── React frontend — HTTP only on host port 3000 ──────────────────────────
  # SSL termination is handled by the HOST Nginx (shared with VianBills).
  # Host Nginx config: config/nginx-jansetu.conf
  frontend:
    image: jansetu-frontend:${DEPLOY_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ""   # relative URLs — proxied by Nginx inside container
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    ports:
      - "127.0.0.1:3000:80"     # host Nginx → 127.0.0.1:3000 → this container
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  mongo_data:
  mongo_config:
  uploads_data:

networks:
  internal:
    driver: bridge
