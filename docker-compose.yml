version: "3.9"

# ── JANSETU — Production Docker Compose ────────────────────────────────────
# Start everything:   docker compose up -d
# View logs:          docker compose logs -f
# Stop everything:    docker compose down
#
# Copy .env.example → .env and fill in all values before first run.

services:

  # ── MongoDB ───────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      # Optional: custom mongod.conf  (see docs/mongod.conf.example)
      # - ./config/mongod.conf:/etc/mongod.conf:ro
    networks:
      - jansetu
    # Bind to localhost — not exposed to the internet
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── FastAPI backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - jansetu
    expose:
      - "8000"
    volumes:
      # Persistent local file storage — mounted at the path set in LOCAL_STORAGE_PATH
      - uploads_data:/var/data/jansetu/uploads
      # Firebase service-account key (push notifications)
      - ./backend/secrets/firebase-admin.json:/app/secrets/firebase-admin.json:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "7"

  # ── React frontend served by Nginx ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Leave empty so the built app uses relative /api URLs (proxied by Nginx)
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jansetu
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Let's Encrypt certs (managed by certbot on the host)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # ACME challenge renewal dir
      - /var/www/certbot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  uploads_data:
    driver: local

networks:
  jansetu:
    driver: bridge
