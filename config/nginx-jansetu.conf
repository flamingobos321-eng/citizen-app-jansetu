# ══════════════════════════════════════════════════════════════════════════════
# HOST NGINX — JanSetu virtual host
# ══════════════════════════════════════════════════════════════════════════════
#
# This file lives on the VPS (not inside Docker).
# Install path: /etc/nginx/sites-available/jansetu.conf
# Enable with:  sudo ln -s /etc/nginx/sites-available/jansetu.conf \
#                          /etc/nginx/sites-enabled/jansetu.conf
#               sudo nginx -t && sudo systemctl reload nginx
#
# It proxies everything for your JanSetu domain to the frontend Docker
# container (127.0.0.1:3000), which in turn proxies /api to the backend.
#
# SSL is handled here — VianBills keeps its own SSL config untouched.
# ══════════════════════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name JANSETU_DOMAIN www.JANSETU_DOMAIN;

    # ACME challenge (certbot renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main site ───────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name JANSETU_DOMAIN www.JANSETU_DOMAIN;

    # ── TLS (managed by certbot) ──────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/JANSETU_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/JANSETU_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options     "nosniff"                                      always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy         "geolocation=(self), camera=(self), microphone=()" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://fcm.googleapis.com; frame-ancestors 'none';" always;

    # ── Upload size (keep in sync with docker-compose backend env) ────────────
    client_max_body_size 55m;

    # ── Proxy everything to the frontend Docker container ─────────────────────
    # The container's internal Nginx serves the SPA and proxies /api → backend.
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # ── Gzip (host-level, before hitting the container) ───────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml image/svg+xml font/woff font/woff2;

    # ── Host-level health check ───────────────────────────────────────────────
    location = /nginx-health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
        access_log off;
    }
}
