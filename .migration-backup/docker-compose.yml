name: jansetu   # namespaces ALL containers, volumes and networks
                # containers: jansetu-mongodb-1, jansetu-backend-1, jansetu-frontend-1
                # volumes:    jansetu_mongo_data, jansetu_uploads_data …
                # never conflicts with VianBills or any other Compose project

# ── JANSETU — Production Docker Compose ────────────────────────────────────
#
# GitHub is the single source of truth.
# NEVER edit application files on the VPS — commit to GitHub, then run:
#   ./scripts/deploy.sh
#
# Reverse proxy + SSL: managed entirely by Nginx Proxy Manager (NPM).
# In NPM, create a Proxy Host:
#   Domain:   jansetu.yourdomain.com
#   Forward:  http  →  127.0.0.1  →  3000
#   SSL:      Request a Let's Encrypt certificate in NPM
# No Nginx config files, no Certbot, no port 80/443 binding in this file.

services:

  # ── MongoDB (JanSetu-exclusive) ───────────────────────────────────────────
  # Host port 27018 avoids conflict with any existing MongoDB on :27017.
  # Only reachable from localhost — not from the internet.
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - internal
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── FastAPI backend ────────────────────────────────────────────────────────
  # Exposed on 127.0.0.1:8000 so NPM can optionally proxy /api directly.
  # The frontend container also reaches it via the internal Docker network.
  backend:
    image: jansetu-backend:${DEPLOY_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - internal
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads_data:/var/data/jansetu/uploads
      - ./backend/secrets/firebase-admin.json:/app/secrets/firebase-admin.json:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "7"

  # ── React frontend ─────────────────────────────────────────────────────────
  # Exposed on 127.0.0.1:3000 — Nginx Proxy Manager proxies to this port.
  # The container's Nginx serves the SPA and proxies /api → backend:8000
  # over the internal Docker network.
  # No ports 80 or 443 are bound; SSL is managed entirely by NPM.
  frontend:
    image: jansetu-frontend:${DEPLOY_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ""   # relative URLs — /api goes through Nginx → backend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  mongo_data:
  mongo_config:
  uploads_data:

networks:
  internal:
    driver: bridge
