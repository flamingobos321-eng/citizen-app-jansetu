# ── JANSETU — Nginx config (INSIDE the frontend container) ─────────────────
#
# This Nginx runs inside Docker and listens on HTTP port 80 only.
# SSL is terminated by the HOST Nginx (config/nginx-jansetu.conf).
# The host Nginx proxies everything for jansetu.yourdomain.com → port 3000 (here).
#
# This file handles:
#   /        — React SPA (try_files → index.html)
#   /api     — proxy → backend:8000 (internal Docker network)

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        image/svg+xml font/woff font/woff2;

    # ── Upload size limit ─────────────────────────────────────────────────────
    client_max_body_size 55m;

    # ── Static assets — long-lived cache ─────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg|webp)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # ── API proxy → FastAPI backend (internal Docker network) ────────────────
    location /api {
        proxy_pass          http://backend:8000;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header    Connection        "";
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
        proxy_request_buffering off;
        client_max_body_size 55m;
    }

    # ── React SPA — no-cache for HTML ────────────────────────────────────────
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # ── Internal health check ─────────────────────────────────────────────────
    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
        access_log off;
    }
}
